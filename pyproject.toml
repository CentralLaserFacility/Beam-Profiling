[project]
name = "beam-shaper"
version = "0.2.0"
description = "Closed-loop temporal pulse shaping: scope feedback drives AWG corrections over EPICS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pyepics>=3.5.10",
    "pyqtgraph>=0.14",
    "PySide6-Essentials>=6.12",
    "scipy>=1.18",
]

[project.scripts]
beam-shaper = "beam_shaper.ui.app:main"

[dependency-groups]
dev = [
    "caproto>=1.3",
    "pyinstaller>=6.10",
    "pytest>=9.2",
    "pytest-qt>=4.5",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beam_shaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
# Captured from the legacy code; kept as it was
extend-exclude = ["tests/golden/generate_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines: left to the formatter
    "B905",  # zip() without strict=
]

[tool.ruff.lint.isort]
known-first-party = ["beam_shaper", "tests"]
